<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="rs-t rs-d" class="rig-svg">
<title id="rs-t">Schematic: thrust-test rig (DynaGence Lab)</title>
<desc id="rs-d">Line drawing of an aquarium tank under an overhead aluminum-profile frame. A 3D-printed mount holds a fish robot in the water through two load cells. The load cells connect to two HX711 amplifiers and an Arduino.</desc>
<style>
.hit{fill:transparent;stroke:none}
.rs-c{fill:#fff;stroke:#D9D5CB;stroke-width:1}
.rs-g{stroke:#EFEBE1;stroke-width:1}
.rs-l{fill:none;stroke:#17191C;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.rs-t{fill:none;stroke:#17191C;stroke-width:.8;stroke-linecap:round}
.rs-d{fill:none;stroke:#5B6169;stroke-width:.8;stroke-dasharray:4 3}
.rs-w{fill:none;stroke:#E4572E;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rs-s{fill:#E4572E}
.rs-f{fill:#fff;stroke:#17191C;stroke-width:1.4;stroke-linejoin:round}
.rs-wa{fill:#2F4858;opacity:.07}
.rs-x{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-size:11px;fill:#17191C;letter-spacing:.02em}
.rs-m{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-size:10px;fill:#5B6169;letter-spacing:.04em}
.rs-n{fill:#17191C}
.rs-nt{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-size:10px;fill:#F6F4EF;font-weight:500}
</style>
<defs>
<pattern id="rs-grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#D9D5CB"/></pattern>
<marker id="rs-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" fill="none" stroke="#E4572E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="720" height="480" fill="url(#rs-grid)"/>

<!-- table -->
<path class="rs-l" d="M20 440H700"/>
<path class="rs-t" d="M20 440l-8 8M60 440l-8 8M100 440l-8 8M140 440l-8 8M180 440l-8 8M220 440l-8 8M260 440l-8 8M300 440l-8 8M340 440l-8 8M380 440l-8 8M420 440l-8 8M460 440l-8 8M500 440l-8 8M540 440l-8 8M580 440l-8 8M620 440l-8 8M660 440l-8 8M700 440l-8 8"/>

<!-- tank -->
<g class="part" data-part="tank">
<rect class="hit" x="86" y="240" width="330" height="204"/>
<rect class="rs-wa" x="92" y="285" width="318" height="155"/>
<path class="rs-l" d="M92 240V440H410V240"/>
<path class="rs-d" d="M92 285H410"/>
<path class="rs-t" d="M104 292q6-4 12 0t12 0t12 0M340 292q6-4 12 0t12 0t12 0"/>
<circle class="rs-n" cx="124" cy="415" r="9"/><text class="rs-nt" x="120.5" y="418.5">5</text>
<text class="rs-x" x="140" y="419">Tank</text>
</g>

<!-- frame -->
<g class="part" data-part="frame">
<rect class="hit" x="44" y="60" width="420" height="30"/><rect class="hit" x="46" y="60" width="36" height="384"/><rect class="hit" x="420" y="60" width="40" height="384"/>
<path class="rs-l" d="M56 440V66H72V440M430 440V66H446V440M48 66H454V82H48Z"/>
<path class="rs-t" d="M64 90V430M438 90V430" stroke-dasharray="2 6"/>
<path class="rs-l" d="M44 440H84M418 440H458"/>
<circle class="rs-n" cx="114" cy="40" r="9"/><text class="rs-nt" x="110.5" y="43.5">1</text>
<path class="rs-t" d="M114 49V66"/>
<text class="rs-x" x="130" y="44">2020 aluminum profile frame</text>
</g>

<!-- hanging plate and mount -->
<g class="part" data-part="mount">
<rect class="hit" x="194" y="78" width="118" height="82"/>
<rect class="rs-f" x="198" y="82" width="10" height="82"/>
<rect class="rs-f" x="242" y="98" width="64" height="56" rx="2"/>
<path class="rs-t" d="M252 108h44M252 144h44M274 98v56"/>
<path class="rs-t" d="M306 124H344"/><circle class="rs-n" cx="354" cy="124" r="9"/><text class="rs-nt" x="350.5" y="127.5">3</text>
<text class="rs-x" x="338" y="150">3D-printed mount</text>
</g>

<!-- load cells -->
<g class="part" data-part="cells">
<rect class="hit" x="150" y="98" width="96" height="56"/>
<rect class="rs-f" x="208" y="104" width="34" height="9"/>
<rect class="rs-f" x="208" y="139" width="34" height="9"/>
<path class="rs-t" d="M216 108.5h18M216 143.5h18"/>
<path class="rs-t" d="M200 124H146"/><circle class="rs-n" cx="136" cy="124" r="9"/><text class="rs-nt" x="132.5" y="127.5">2</text>
<text class="rs-x" x="80" y="152">Load cells</text>
</g>

<!-- rod and fish -->
<g class="part" data-part="fish">
<rect class="hit" x="196" y="154" width="140" height="224"/>
<path class="rs-l" d="M274 154V326"/>
<path class="rs-f" d="M206 342C222 322 262 322 284 334V350C262 362 222 362 206 342Z"/>
<circle class="rs-t" cx="236" cy="338" r="2.5"/>
<path class="rs-f" data-el="tail" d="M284 334L326 322 318 342 326 362 284 350Z"/>
<path class="rs-t" d="M326 342H356"/><circle class="rs-n" cx="366" cy="342" r="9"/><text class="rs-nt" x="362.5" y="345.5">4</text>
<text class="rs-x" x="330" y="378">Fish robot</text>
</g>
<path class="rs-w" d="M200 342H160" marker-end="url(#rs-ar)"/>
<text class="rs-x" x="118" y="368" fill="#E4572E" style="fill:#B8401C">thrust</text>

<!-- wires -->
<path class="rs-w" data-el="w1" d="M225 104V96H478V346H500"/>
<path class="rs-w" data-el="w2" d="M225 148V164H466V396H500"/>

<!-- breadboard, HX711 -->
<rect class="rs-f" x="488" y="318" width="84" height="112" rx="3" style="fill:#F6F4EF"/>
<g class="part" data-part="hx">
<rect class="hit" x="494" y="324" width="70" height="94"/>
<rect class="rs-f" x="500" y="330" width="58" height="32"/>
<rect class="rs-f" x="500" y="380" width="58" height="32"/>
<path class="rs-t" d="M506 340h20M506 346h20M506 352h20M506 390h20M506 396h20M506 402h20"/>
<circle class="rs-n" cx="548" cy="346" r="2.5"/><circle class="rs-n" cx="548" cy="396" r="2.5"/>
<path class="rs-t" d="M530 330V310"/><circle class="rs-n" cx="530" cy="300" r="9"/><text class="rs-nt" x="526.5" y="303.5">6</text>
<text class="rs-x" x="544" y="290">HX711</text>
<text class="rs-x" x="544" y="304">amplifiers</text>
</g>

<!-- Arduino -->
<g class="part" data-part="arduino">
<rect class="hit" x="600" y="320" width="104" height="116"/>
<rect class="rs-f" x="606" y="362" width="94" height="70" rx="3"/>
<rect class="rs-f" x="672" y="372" width="22" height="22"/>
<path class="rs-t" d="M614 368h50M614 426h50"/>
<path class="rs-t" d="M614 369v-2M622 369v-2M630 369v-2M638 369v-2M646 369v-2M654 369v-2"/>
<path class="rs-t" d="M630 362V342"/><circle class="rs-n" cx="630" cy="332" r="9"/><text class="rs-nt" x="626.5" y="335.5">7</text>
<text class="rs-x" x="644" y="336">Arduino</text>
</g>
<path class="rs-l" d="M558 346H582V378H606M558 396H582V410H606"/>
<path class="rs-d" data-el="ser" d="M696 362V228" marker-end="url(#rs-ar)"/>
<path class="rs-t" d="M558 346H582V378H606" data-el="h1" style="stroke:none"/>
<path class="rs-t" d="M558 396H582V410H606" data-el="h2" style="stroke:none"/>

<!-- strip chart (illustrative) -->
<g data-el="chart">
<rect class="rs-c" x="488" y="116" width="212" height="112" rx="2"/>
<path class="rs-g" d="M498 146H692M498 176H692M498 206H692M522 142V218M570 142V218M618 142V218M666 142V218"/>
<text class="rs-m" x="496" y="130">THRUST · ILLUSTRATIVE</text>
<polyline data-el="trace" class="rs-w" points="498.0,206.0 502.0,204.8 506.1,206.3 510.1,207.1 514.2,205.4 518.2,205.0 522.2,206.8 526.3,206.7 530.3,205.0 534.4,205.5 538.4,207.2 542.5,206.2 546.5,204.8 550.5,187.0 554.6,187.1 558.6,195.2 562.7,205.2 566.7,212.8 570.8,213.1 574.8,208.2 578.8,205.2 582.9,205.1 586.9,204.4 591.0,203.9 595.0,206.0 599.0,207.8 603.1,206.3 607.1,205.2 611.2,206.5 615.2,206.8 619.2,205.0 623.3,205.1 627.3,207.0 631.4,206.6 635.4,194.9 639.5,184.4 643.5,190.3 647.5,200.1 651.6,208.1 655.6,213.1 659.7,212.3 663.7,207.1 667.8,204.0 671.8,204.8 675.8,205.1 679.9,204.4 683.9,206.0 688.0,207.8 692.0,206.6" style="stroke-width:1.3"/>
</g>

<!-- profile section inset -->
<g transform="translate(592 40)">
<rect class="rs-f" x="0" y="0" width="28" height="28"/>
<rect class="rs-t" x="9" y="9" width="10" height="10"/>
<circle class="rs-t" cx="14" cy="14" r="2.4"/>
<path class="rs-t" d="M9 3H19M9 25H19M3 9V19M25 9V19"/>
<text class="rs-m" x="38" y="12">2020 profile</text>
<text class="rs-m" x="38" y="25">section</text>
</g>
<text class="rs-m" x="600" y="470" text-anchor="end">NOT TO SCALE</text>
</svg>
